name: CI checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap evaluation-only gate: runs on every push and PR (including dependabot
  # lock bumps) and force-evaluates the whole flake:
  #   - `nix flake check` covers packages, dev shells and nixosConfigurations
  #     (standard outputs only — it skips darwinConfigurations,
  #     homeConfigurations and images entirely)
  #   - `.#evalTests` (see flake.nix) forces every host entry of all four kinds
  # Evaluation is architecture-independent, so one x86_64 runner suffices.
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix --accept-flake-config flake check --all-systems

      # --json: the plain printer renders broken entries as «error» strings
      # and still exits 0
      - run: nix --accept-flake-config eval --impure --json .#evalTests --show-trace
