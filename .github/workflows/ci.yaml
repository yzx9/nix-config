name: Build and Push to cachix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap evaluation-only gate: runs on every push and PR (including dependabot
  # lock bumps) and force-evaluates the whole flake:
  #   - `nix flake check` covers packages, dev shells and nixosConfigurations
  #     (standard outputs only — it skips darwinConfigurations,
  #     homeConfigurations and images entirely)
  #   - `.#evalTests` (see flake.nix) forces every host entry of all four kinds
  # Evaluation is architecture-independent, so one x86_64 runner suffices.
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The packages output pulls unfree nixvim (copilot-language-server), and
      # standalone homeConfigurations cannot whitelist unfree from within
      # their modules (pkgs is passed directly in lib.nix).
      NIXPKGS_ALLOW_UNFREE: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix --accept-flake-config flake check --all-systems --impure
      # --json: the plain printer renders broken entries as «error» strings
      # and still exits 0
      - run: nix --accept-flake-config eval --impure --json .#evalTests --show-trace

  build-packages:
    if: github.event_name != 'pull_request' # cache-filling jobs, run on push only
    strategy:
      # Continue with the remaining packages if one fails
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-darwin

        package:
          - aim
          - gstack
          - zotero-mcp

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/main'
        with:
          name: "${{ secrets.CACHIX_CACHE_NAME }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build package
        run: |
          available=$(nix eval --json '.#${{ matrix.package }}.meta.available' 2>/dev/null || echo "false")
          if [ "$available" = "true" ]; then
            nix --accept-flake-config build .#${{ matrix.package }}
          else
            echo "Skipping ${{ matrix.package }} - not available on this platform"
          fi

  build-nixos-configuration:
    if: github.event_name != 'pull_request' # cache-filling jobs, run on push only
    strategy:
      fail-fast: false # Continue with the remaining packages if one fails
      max-parallel: 1 # To reuse the cache
      matrix:
        conf:
          - os: ubuntu-24.04-arm
            host: yzx9-rpi5
          - os: ubuntu-24.04-arm
            host: yzx9-pie

    runs-on: ${{ matrix.conf.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/main'
        with:
          name: "${{ secrets.CACHIX_CACHE_NAME }}"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix --accept-flake-config build .#nixosConfigurations.${{matrix.conf.host}}.config.system.build.toplevel
